<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Màn Hình Hacker Matrix (0 & 1)</title>
    <style>
        /* Xóa bỏ khoảng trắng thừa và ẩn thanh cuộn của trình duyệt */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Định vị Canvas phủ kín toàn bộ màn hình */
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>

    <!-- Thẻ canvas nơi mã JavaScript sẽ vẽ các chữ số -->
    <canvas id="matrixCanvas"></canvas>

    <script>
        // Lấy đối tượng canvas và ngữ cảnh vẽ 2D
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        // Hàm tự động thay đổi kích thước canvas theo kích thước màn hình
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Cấu hình các ký tự hiển thị (chỉ gồm 0 và 1)
        const alphabet = "01";
        
        // Kích thước font chữ và số lượng cột dựa trên chiều rộng màn hình
        const fontSize = 16;
        let columns = Math.floor(canvas.width / fontSize);

        // Mảng lưu trữ tọa độ Y hiện tại của từng cột
        let rainDrops = [];

        // Khởi tạo vị trí ban đầu ngẫu nhiên cho các giọt nước số rơi
        function initRainDrops() {
            columns = Math.floor(canvas.width / fontSize);
            rainDrops = [];
            for (let x = 0; x < columns; x++) {
                // Giá trị âm hoặc ngẫu nhiên giúp các cột xuất hiện không đồng đều ngay từ đầu
                rainDrops[x] = Math.random() * -100; 
            }
        }
        initRainDrops();
        // Cập nhật lại số lượng cột nếu người dùng thay đổi kích thước trình duyệt
        window.addEventListener('resize', initRainDrops);

        // Hàm vẽ hiệu ứng
        function draw() {
            // Tạo lớp phủ màu đen mờ (alpha 0.05) để tạo hiệu ứng vệt mờ (trail) phía sau chữ số
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Cấu hình màu sắc và font chữ cho ký tự số
            ctx.fillStyle = '#0F0'; // Màu xanh lá đặc trưng hacker
            ctx.font = fontSize + 'px monospace';

            // Lặp qua từng cột để vẽ chữ số
            for (let i = 0; i < rainDrops.length; i++) {
                // Chọn ngẫu nhiên ký tự '0' hoặc '1'
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                
                // Tính toán tọa độ X và Y để vẽ
                const x = i * fontSize;
                const y = rainDrops[i] * fontSize;

                // Vẽ ký tự lên màn hình
                ctx.fillText(text, x, y);

                // Nếu chữ số rơi quá màn hình, reset nó về đỉnh kèm tỷ lệ ngẫu nhiên 
                // để các cột không rơi đều tăm tắp cùng một lúc
                if (y > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }

                // Tăng tọa độ Y để chữ số tiếp tục rơi xuống ở khung hình sau
                rainDrops[i]++;
            }
        }

        // Chạy hàm draw liên tục sau mỗi 30ms (khoảng 33 khung hình/giây)
        setInterval(draw, 30);
    </script>
</body>
</html>
