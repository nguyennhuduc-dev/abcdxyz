            height: 100%;

        /* =========================

        body::after {

                ),

        /* =========================

        #matrixCanvas {

            inset: 0;

            width: 100%;
            height: 100%;

            display: block;

            z-index: 1;
        }

        /* =========================

            position: absolute;

            top: 50%;
            left: 50%;

            width: 90%;

<body>

    <!-- MATRIX -->
    <canvas id="matrixCanvas"></canvas>

    <!-- TERMINAL -->
    <div
        class="terminal-overlay"
        id="terminalOverlay"
    >

        <!-- HEADER -->
        <div class="terminal-header">
            <div>
                [SYS_STATUS: ACTIVE]
                //
                CPU_LOAD: 84%
                //
                RAM_FREE: 12%
            </div>

            <div id="liveClock">
                00:00:00
            </div>
        </div>

        <!-- OUTPUT -->
        <div
            class="terminal-body"
            id="terminalBody"
        ></div>

        <!-- SUCCESS -->
        <div
            class="success-box"
            id="successBox"
        >
            &gt; DECRYPTION COMPLETE - CORE UNLOCKED &lt;
        </div>

        <!-- COMMAND INPUT -->
        <div
            class="input-line"
            id="inputContainer"
        >
            <span class="prompt">
                root@override:~#
            </span>

            <input
                type="text"
                id="cmdInput"
                autofocus
                autocomplete="off"
                spellcheck="false"
            >
        </div>

    </div>

    <script>

        /* =========================================================
           MATRIX BACKGROUND
        ========================================================= */

        const canvas =
            document.getElementById("matrixCanvas");

        const ctx =
            canvas.getContext("2d");

        let matrixColor = "#00ff00";

        function resizeCanvas() {

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

        }

        resizeCanvas();

        window.addEventListener(
            "resize",
            resizeCanvas
        );


        const alphabet = "01";

        const fontSize = 16;

        let columns = 0;

        let rainDrops = [];


        function initRainDrops() {

            columns =
                Math.floor(
                    canvas.width / fontSize
                );

            rainDrops = [];

            for (
                let x = 0;
                x < columns;
                x++
            ) {

                rainDrops[x] =
                    Math.random() * -100;

            }

        }

        initRainDrops();

        window.addEventListener(
            "resize",
            initRainDrops
        );


        function drawMatrix() {

            ctx.fillStyle =
                "rgba(0, 0, 0, 0.06)";

            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            ctx.font =
                fontSize + "px monospace";


            for (
                let i = 0;
                i < rainDrops.length;
                i++
            ) {

                const text =
                    alphabet.charAt(
                        Math.floor(
                            Math.random() *
                            alphabet.length
                        )
                    );

                const x =
                    i * fontSize;

                const y =
                    rainDrops[i] *
                    fontSize;


                ctx.fillStyle =
                    Math.random() > 0.98
                        ? "#ffffff"
                        : matrixColor;


                ctx.fillText(
                    text,
                    x,
                    y
                );


                if (
                    y > canvas.height &&
                    Math.random() > 0.975
                ) {

                    rainDrops[i] = 0;

                }

                rainDrops[i]++;

            }

        }


        setInterval(
            drawMatrix,
            35
        );


        /* =========================================================
           CLOCK
        ========================================================= */

        const liveClock =
            document.getElementById(
                "liveClock"
            );


        function updateClock() {

            liveClock.textContent =
                new Date().toLocaleTimeString(
                    "vi-VN"
                );

        }

        updateClock();

        setInterval(
            updateClock,
            1000
        );


        /* =========================================================
           TERMINAL ELEMENTS
        ========================================================= */

        const terminalBody =
            document.getElementById(
                "terminalBody"
            );

        const successBox =
            document.getElementById(
                "successBox"
            );

        const inputContainer =
            document.getElementById(
                "inputContainer"
            );

        const cmdInput =
            document.getElementById(
                "cmdInput"
            );


        /* =========================================================
           SAFE OUTPUT
        ========================================================= */

        function createOutputLine(
            text,
            type = "normal"
        ) {

            const line =
                document.createElement(
                    "div"
                );

            line.className =
                "log-line";


            if (type === "error") {

                line.classList.add(
                    "error-text"
                );

            }

            if (type === "warning") {

                line.classList.add(
                    "warning-text"
                );

            }

            if (type === "cyan") {

                line.classList.add(
                    "cyan-text"
                );

            }


            line.textContent = text;

            terminalBody.appendChild(
                line
            );

            terminalBody.scrollTop =
                terminalBody.scrollHeight;

        }


        /* =========================================================
           AUTO BOOT LOG
        ========================================================= */

        const autoLogs = [

            "Initializing secure proxy nodes...",

            "Target system breached successfully.",

            "Injecting rootkit virus into sector 0x7FFF...",

            "BRUTE_FORCE_ANIMATION",

            "Clearing system trace logs...",

            "Loading interactive command interface...",

            "Type 'help' to view available mainframe commands."

        ];


        let autoIdx = 0;


        function printAutoLog() {

            if (
                autoIdx >=
                autoLogs.length
            ) {

                successBox.style.display =
                    "block";

                inputContainer.style.display =
                    "flex";

                cmdInput.focus();

                return;

            }


            const current =
                autoLogs[autoIdx];


            /* =========================
               PROGRESS BAR
            ========================= */

            if (
                current ===
                "BRUTE_FORCE_ANIMATION"
            ) {

                const progLine =
                    document.createElement(
                        "div"
                    );

                progLine.className =
                    "log-line";

                terminalBody.appendChild(
                    progLine
                );


                let progress = 0;


                const interval =
                    setInterval(() => {

                        progress +=
                            Math.floor(
                                Math.random() * 12
                            ) + 3;


                        if (
                            progress >= 100
                        ) {

                            progress = 100;

                            clearInterval(
                                interval
                            );


                            progLine.textContent =
                                "> Cracking root hash... [####################] 100% DONE";


                            autoIdx++;

                            setTimeout(
                                printAutoLog,
                                400
                            );

                        }
                        else {

                            const blocks =
                                Math.floor(
                                    progress / 5
                                );

                            const empty =
                                20 - blocks;


                            progLine.textContent =
                                "> Cracking root hash... [" +
                                "#".repeat(blocks) +
                                ".".repeat(empty) +
                                "] " +
                                progress +
                                "%";

                        }


                        terminalBody.scrollTop =
                            terminalBody.scrollHeight;

                    }, 60);


                return;

            }


            /* =========================
               NORMAL LOG
            ========================= */

            const line =
                document.createElement(
                    "div"
                );

            line.className =
                "log-line";


            const prefix =
                document.createElement(
                    "span"
                );

            prefix.textContent =
                "> ";


            const content =
                document.createElement(
                    "span"
                );

            content.className =
                "highlight";

            content.textContent =
                current;


            line.appendChild(prefix);
            line.appendChild(content);


            terminalBody.appendChild(
                line
            );


            terminalBody.scrollTop =
                terminalBody.scrollHeight;


            autoIdx++;


            setTimeout(
                printAutoLog,
                Math.random() * 500 + 300
            );

        }


        setTimeout(
            printAutoLog,
            800
        );


        /* =========================================================
           COMMAND HISTORY
        ========================================================= */

        let commandHistory = [];

        let historyIndex = -1;


        /* =========================================================
           COMMAND INPUT
        ========================================================= */

        cmdInput.addEventListener(
            "keydown",
            function (event) {

                /* ENTER */

                if (
                    event.key === "Enter"
                ) {

                    const inputVal =
                        this.value.trim();


                    this.value = "";


                    if (!inputVal) {

                        return;

                    }


                    commandHistory.push(
                        inputVal
                    );

                    historyIndex =
                        commandHistory.length;


                    /* USER COMMAND */

                    const userLine =
                        document.createElement(
                            "div"
                        );

                    userLine.className =
                        "log-line";


                    const prompt =
                        document.createElement(
                            "span"
                        );

                    prompt.style.color =
                        "#00ff88";

                    prompt.textContent =
                        "root@override:~# ";


                    const command =
                        document.createElement(
                            "span"
                        );

                    command.textContent =
                        inputVal;


                    userLine.appendChild(
                        prompt
                    );

                    userLine.appendChild(
                        command
                    );


                    terminalBody.appendChild(
                        userLine
                    );


                    processCommand(
                        inputVal
                    );


                    terminalBody.scrollTop =
                        terminalBody.scrollHeight;

                }


                /* ARROW UP */

                if (
                    event.key === "ArrowUp"
                ) {

                    if (
                        commandHistory.length === 0
                    ) {

                        return;

                    }


                    historyIndex =
                        Math.max(
                            0,
                            historyIndex - 1
                        );


                    this.value =
                        commandHistory[
                            historyIndex
                        ] || "";


                    event.preventDefault();

                }


                /* ARROW DOWN */

                if (
                    event.key === "ArrowDown"
                ) {

                    if (
                        commandHistory.length === 0
                    ) {

                        return;

                    }


                    historyIndex =
                        Math.min(
                            commandHistory.length,
                            historyIndex + 1
                        );


                    this.value =
                        commandHistory[
                            historyIndex
                        ] || "";


                    event.preventDefault();

                }

            }
        );


        /* =========================================================
           COMMAND SYSTEM
        ========================================================= */

        function processCommand(
            cmdText
        ) {

            const parts =
                cmdText
                    .trim()
                    .split(/\s+/);


            const command =
                parts[0].toLowerCase();


            switch (command) {


                /* =========================
                   HELP
                ========================= */

                case "help":

                    createOutputLine(
                        "Available commands:"
                    );

                    createOutputLine(
                        "  help       - Show available commands"
                    );

                    createOutputLine(
                        "  about      - About this system"
                    );

                    createOutputLine(
                        "  whoami     - Display current user"
                    );

                    createOutputLine(
                        "  status     - Display system status"
                    );

                    createOutputLine(
                        "  neofetch   - Display system information"
                    );

                    createOutputLine(
                        "  date       - Display current date/time"
                    );

                    createOutputLine(
                        "  matrix     - Change Matrix color"
                    );

                    createOutputLine(
                        "  clear      - Clear terminal"
                    );

                    createOutputLine(
                        "  echo       - Print text"
                    );

                    createOutputLine(
                        "  projects   - Show projects"
                    );

                    createOutputLine(
                        "  contact    - Show contact information"
                    );

                    createOutputLine(
                        "  reboot     - Restart terminal animation"
                    );

                    break;


                /* =========================
                   ABOUT
                ========================= */

                case "about":

                    createOutputLine(
                        "NG NH ĐỨC PRIME"
                    );

                    createOutputLine(
                        "Interactive terminal interface."
                    );

                    createOutputLine(
                        "Built with HTML, CSS and JavaScript."
                    );

                    createOutputLine(
                        "System mode: ONLINE"
                    );

                    break;


                /* =========================
                   WHOAMI
                ========================= */

                case "whoami":

                    createOutputLine(
                        "root"
                    );

                    createOutputLine(
                        "Access level: ADMINISTRATOR"
                    );

                    break;


                /* =========================
                   STATUS
                ========================= */

                case "status":

                    createOutputLine(
                        "[SYSTEM STATUS]"
                    );

                    createOutputLine(
                        "CPU: ONLINE"
                    );

                    createOutputLine(
                        "RAM: ONLINE"
                    );

                    createOutputLine(
                        "NETWORK: CONNECTED"
                    );

                    createOutputLine(
                        "MATRIX ENGINE: ACTIVE"
                    );

                    createOutputLine(
                        "TERMINAL: READY"
                    );

                    break;


                /* =========================
                   NEOFETCH
                ========================= */

                case "neofetch":

                    createOutputLine(
                        "        ████████       "
                    );

                    createOutputLine(
                        "      ██        ██     "
                    );

                    createOutputLine(
                        "     ██   0101   ██    "
                    );

                    createOutputLine(
                        "     ██   ROOT   ██    "
                    );

                    createOutputLine(
                        "      ██        ██     "
                    );

                    createOutputLine(
                        "        ████████       "
                    );

                    createOutputLine(
                        "----------------------"
                    );

                    createOutputLine(
                        "OS: NG NH ĐỨC PRIME"
                    );

                    createOutputLine(
                        "Shell: Override Shell"
                    );

                    createOutputLine(
                        "Engine: JavaScript"
                    );

                    createOutputLine(
                        "Theme: Matrix CRT"
                    );

                    createOutputLine(
                        "Status: ONLINE"
                    );

                    break;


                /* =========================
                   DATE
                ========================= */

                case "date":

                    createOutputLine(
                        new Date().toString()
                    );

                    break;


                /* =========================
                   CLEAR
                ========================= */

                case "clear":

                    terminalBody.innerHTML = "";

                    break;


                /* =========================
                   ECHO
                ========================= */

                case "echo":

                    if (
                        parts.length < 2
                    ) {

                        createOutputLine(
                            "Usage: echo <text>",
                            "warning"
                        );

                    }
                    else {

                        createOutputLine(
                            parts
                                .slice(1)
                                .join(" ")
                        );

                    }

                    break;


                /* =========================
                   PROJECTS
                ========================= */

                case "projects":

                    createOutputLine(
                        "[PROJECT DATABASE]"
                    );

                    createOutputLine(
                        "01. Web Development"
                    );

                    createOutputLine(
                        "02. Python Projects"
                    );

                    createOutputLine(
                        "03. C++ Projects"
                    );

                    createOutputLine(
                        "04. Game Development"
                    );

                    createOutputLine(
                        "05. GitHub Projects"
                    );

                    break;


                /* =========================
                   CONTACT
                ========================= */

                case "contact":

                    createOutputLine(
                        "[CONTACT]"
                    );

                    createOutputLine(
                        "GitHub: nguyennhuduc-dev"
                    );

                    createOutputLine(
                        "Status: Available"
                    );

                    break;


                /* =========================
                   MATRIX
                ========================= */

                case "matrix":

                    if (
                        !parts[1]
                    ) {

                        createOutputLine(
                            "Usage: matrix <green|red|blue|cyan|white>",
                            "warning"
                        );

                        break;

                    }


                    const colors = {

                        green: "#00ff00",

                        red: "#ff3333",

                        blue: "#3399ff",

                        cyan: "#00ffff",

                        white: "#ffffff"

                    };


                    const selectedColor =
                        parts[1].toLowerCase();


                    if (
                        colors[selectedColor]
                    ) {

                        matrixColor =
                            colors[
                                selectedColor
                            ];


                        createOutputLine(
                            "Matrix color changed to " +
                            selectedColor,
                            "cyan"
                        );

                    }
                    else {

                        createOutputLine(
                            "Unknown color.",
                            "error"
                        );

                    }

                    break;


                /* =========================
                   REBOOT
                ========================= */

                case "reboot":

                    createOutputLine(
                        "Rebooting terminal...",
                        "warning"
                    );


                    setTimeout(
                        () => {

                            terminalBody.innerHTML =
                                "";

                            successBox.style.display =
                                "none";

                            inputContainer.style.display =
                                "none";

                            autoIdx = 0;

                            setTimeout(
                                printAutoLog,
                                500
                            );

                        },
                        800
                    );

                    break;


                /* =========================
                   EXIT
                ========================= */

                case "exit":

                    createOutputLine(
                        "Session closed. Type anything to continue.",
                        "warning"
                    );

                    break;


                /* =========================
                   UNKNOWN
                ========================= */

                default:

                    createOutputLine(
                        "Command not found: " +
                        command,
                        "error"
                    );

                    createOutputLine(
                        "Type 'help' to view available commands.",
                        "warning"
                    );

                    break;

            }

        }


        /* =========================================================
           CLICK TERMINAL = FOCUS INPUT
        ========================================================= */

        document
            .getElementById("terminalOverlay")
            .addEventListener(
                "click",
                function () {

                    if (
                        inputContainer.style.display !==
                        "none"
                    ) {

                        cmdInput.focus();

                    }

                }
            );


    </script>

</body>
</html>
