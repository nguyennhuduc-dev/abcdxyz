<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacker Terminal v2.0 - Matrix Overlay</title>
    <!-- Nhúng font chữ Monospace chuyên dụng cho lập trình -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: 'Share Tech Mono', monospace;
        }

        /* Lớp Canvas nền Matrix */
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Giao diện Terminal đè lên nền */
        .terminal-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 700px;
            height: 400px;
            background: rgba(0, 5, 0, 0.85);
            border: 1px solid #0f0;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
            z-index: 2;
            padding: 20px;
            color: #0f0;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
        }

        /* Thanh tiêu đề Terminal */
        .terminal-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #0f0;
            padding-bottom: 5px;
            margin-bottom: 15px;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .terminal-buttons span {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #0f0;
            border-radius: 50%;
            margin-left: 5px;
        }

        /* Nội dung Log chạy chữ */
        .terminal-body {
            flex-grow: 1;
            overflow-y: auto;
            font-size: 16px;
            line-height: 1.5;
        }

        .log-line {
            margin-bottom: 8px;
            white-space: pre-wrap;
        }

        /* Chữ màu trắng highlight */
        .highlight {
            color: #fff;
            text-shadow: 0 0 8px #0f0;
        }

        /* Dòng chữ thành công màu đỏ rực rỡ */
        .success-box {
            border: 2px dashed #0f0;
            padding: 15px;
            text-align: center;
            font-size: 24px;
            margin-top: 20px;
            font-weight: bold;
            animation: blink 1s infinite;
            background: rgba(0, 30, 0, 0.5);
            display: none;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.98); }
        }

        /* Thanh cuộn tùy biến ẩn đi cho đẹp */
        .terminal-body::-webkit-scrollbar {
            width: 5px;
        }
        .terminal-body::-webkit-scrollbar-thumb {
            background: #0f0;
        }
    </style>
</head>
<body>

    <!-- Nền số chạy -->
    <canvas id="matrixCanvas"></canvas>

    <!-- Hộp thoại Hacker chuyên nghiệp -->
    <div class="terminal-overlay">
        <div class="terminal-header">
            <div>[root@system_override:~]\$ bypass_protocol</div>
            <div class="terminal-buttons">
                <span></span><span></span><span></span>
            </div>
        </div>
        <div class="terminal-body" id="terminalBody">
            <!-- JavaScript sẽ tự động bơm các dòng log mã hóa vào đây -->
        </div>
        <div class="success-box" id="successBox">
            > ACCESS GRANTED <
        </div>
    </div>

    <script>
        // --- PHẦN 1: TỐI ƯU HIỆU ỨNG CANVAS MATRIX (0 & 1) ---
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const alphabet = "01";
        const fontSize = 16;
        let columns = Math.floor(canvas.width / fontSize);
        let rainDrops = [];

        function initRainDrops() {
            columns = Math.floor(canvas.width / fontSize);
            rainDrops = [];
            for (let x = 0; x < columns; x++) {
                rainDrops[x] = Math.random() * -100; 
            }
        }
        initRainDrops();
        window.addEventListener('resize', initRainDrops);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.06)'; // Tăng nhẹ độ mờ để vệt trail mượt hơn
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                const x = i * fontSize;
                const y = rainDrops[i] * fontSize;

                // THAY ĐỔI LỚN: Ký tự đi đầu dòng sẽ có màu trắng sáng rực
                if (Math.random() > 0.98) {
                    ctx.fillStyle = '#fff';
                } else {
                    ctx.fillStyle = '#0F0';
                }

                ctx.font = fontSize + 'px monospace';
                ctx.fillText(text, x, y);

                if (y > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        }
        setInterval(drawMatrix, 35);


        // --- PHẦN 2: MÔ PHỎNG TERMINAL GÕ CHỮ TỰ ĐỘNG ---
        const terminalBody = document.getElementById('terminalBody');
        const successBox = document.getElementById('successBox');

        // Danh sách các câu lệnh giả lập chạy trên màn hình
        const logs = [
            "Initializing connection to remote core...",
            "Target IP identified: 192.168.88.254",
            "Bypassing firewall protocols... [FAILED] - Retrying...",
            "Injecting SQL payload into secure database auth node...",
            "Breaching Mainframe Sector 7G...",
            "Decrypting RSA 4096-bit master keys...",
            "Brute forcing root access password... [||||||||||||||] 100%",
            "Downloading encrypted core data packets...",
            "Clearing system logs to erase footprints...",
            "Establishing permanent proxy tunnel..."
        ];

        let logIndex = 0;

        function typeLog() {
            if (logIndex < logs.length) {
                const line = document.createElement('div');
                line.className = 'log-line';
                line.innerHTML = `> <span class="highlight">${logs[logIndex]}</span>`;
                terminalBody.appendChild(line);
                
                // Tự động cuộn terminal xuống dòng mới nhất
                terminalBody.scrollTop = terminalBody.scrollHeight;
                
                logIndex++;
                // Thời gian gõ giữa các dòng ngẫu nhiên để giống thật
                setTimeout(typeLog, Math.random() * 800 + 400); 
            } else {
                // Hiển thị bảng thông báo Đã truy cập thành công sau khi chạy hết log
                setTimeout(() => {
                    successBox.style.display = 'block';
                }, 500);
            }
        }

        // Kích hoạt chạy log sau khi trang tải xong 1 giây
        setTimeout(typeLog, 1000);
    </script>
</body>
</html>
