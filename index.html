<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ng Nh Đức Prime</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: 'Share Tech Mono', monospace;
        }

        /* Hiệu ứng màn hình CRT cổ điển */
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .terminal-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 850px;
            height: 500px;
            background: rgba(0, 8, 0, 0.88);
            border: 1px solid #0f0;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.2);
            z-index: 2;
            padding: 20px;
            color: #0f0;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
        }

        .terminal-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #0f0;
            padding-bottom: 8px;
            margin-bottom: 15px;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .terminal-body {
            flex-grow: 1;
            overflow-y: auto;
            font-size: 15px;
            line-height: 1.6;
        }

        .log-line {
            margin-bottom: 6px;
            white-space: pre-wrap;
        }

        .highlight {
            color: #fff;
            text-shadow: 0 0 5px #0f0;
        }

        .error-text {
            color: #ff3333;
            text-shadow: 0 0 5px #ff3333;
        }

        /* Khu vực nhập lệnh */
        .input-line {
            display: none;
            align-items: center;
            margin-top: 10px;
        }

        .prompt {
            color: #0f0;
            margin-right: 10px;
            font-weight: bold;
        }

        #cmdInput {
            background: transparent;
            border: none;
            color: #fff;
            font-family: 'Share Tech Mono', monospace;
            font-size: 16px;
            outline: none;
            flex-grow: 1;
            text-shadow: 0 0 5px #0f0;
        }

        .success-box {
            border: 2px dashed #0f0;
            padding: 10px;
            text-align: center;
            font-size: 20px;
            margin: 15px 0;
            font-weight: bold;
            animation: blink 1.5s infinite;
            background: rgba(0, 30, 0, 0.4);
            display: none;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .terminal-body::-webkit-scrollbar { width: 6px; }
        .terminal-body::-webkit-scrollbar-thumb { background: #0f0; }
    </style>
</head>
<body>

    <canvas id="matrixCanvas"></canvas>

    <div class="terminal-overlay" onclick="document.getElementById('cmdInput').focus()">
        <div class="terminal-header">
            <div>[SYS_STATUS: ACTIVE] // CPU_LOAD: 84% // RAM_FREE: 12%</div>
            <div id="liveClock">00:00:00</div>
        </div>
        <div class="terminal-body" id="terminalBody">
            <!-- Log tự động sẽ chạy ở đây -->
        </div>
        <div class="success-box" id="successBox">> DECRYPTION COMPLETE - CORE UNLOCKED <</div>
        
        <!-- Khung nhập lệnh tương tác thực tế -->
        <div class="input-line" id="inputContainer">
            <span class="prompt">root@override:~#</span>
            <input type="text" id="cmdInput" autofocus autocomplete="off" spellcheck="false">
        </div>
    </div>

    <script>
        // --- ĐỒ HỌA MA TRẬN NỀN ---
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        let matrixColor = '#0F0'; 

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const alphabet = "01";
        const fontSize = 16;
        let columns = Math.floor(canvas.width / fontSize);
        let rainDrops = [];

        function initRainDrops() {
            columns = Math.floor(canvas.width / fontSize);
            rainDrops = [];
            for (let x = 0; x < columns; x++) { rainDrops[x] = Math.random() * -100; }
        }
        initRainDrops();
        window.addEventListener('resize', initRainDrops);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.06)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                const x = i * fontSize;
                const y = rainDrops[i] * fontSize;

                ctx.fillStyle = Math.random() > 0.98 ? '#fff' : matrixColor;
                ctx.fillText(text, x, y);

                if (y > canvas.height && Math.random() > 0.975) { rainDrops[i] = 0; }
                rainDrops[i]++;
            }
        }
        setInterval(drawMatrix, 35);

        // Đồng hồ thời gian thực ở Header
        setInterval(() => {
            document.getElementById('liveClock').innerText = new Date().toLocaleTimeString();
        }, 1000);

        // --- HỆ THỐNG CHẠY CHỮ TỰ ĐỘNG BAN ĐẦU ---
        const terminalBody = document.getElementById('terminalBody');
        const successBox = document.getElementById('successBox');
        const inputContainer = document.getElementById('inputContainer');
        const cmdInput = document.getElementById('cmdInput');

        const autoLogs = [
            "Initializing secure proxy nodes...",
            "Target system breached successfully.",
            "Injecting rootkit virus into sector 0x7FFF...",
            "BRUTE_FORCE_ANIMATION",
            "Clearing system trace logs...",
            "Type 'help' to view available mainframe commands."
        ];
        let autoIdx = 0;

        function printAutoLog() {
            if (autoIdx < autoLogs.length) {
                if (autoLogs[autoIdx] === "BRUTE_FORCE_ANIMATION") {
                    const progLine = document.createElement('div');
                    progLine.className = 'log-line';
                    terminalBody.appendChild(progLine);
                    let p = 0;
                    const itv = setInterval(() => {
                        p += Math.floor(Math.random() * 12) + 3;
                        if (p >= 100) {
                            p = 100; clearInterval(itv);
                            progLine.innerHTML = `> Cracking root hash... [<span class="highlight">${'#'.repeat(20)}</span>] 100% DONE`;
                            autoIdx++; setTimeout(printAutoLog, 400);
                        } else {
                            let b = Math.floor(p/5);
                            progLine.innerHTML = `> Cracking root hash... [${'#'.repeat(b)}${'.'.repeat(20-b)}] ${p}%`;
                        }
                        terminalBody.scrollTop = terminalBody.scrollHeight;
                    }, 60);
                } else {
                    const line = document.createElement('div');
                    line.className = 'log-line';
                    line.innerHTML = `> <span class="highlight">${autoLogs[autoIdx]}</span>`;
                    terminalBody.appendChild(line);
                    terminalBody.scrollTop = terminalBody.scrollHeight;
                    autoIdx++;
                    setTimeout(printAutoLog, Math.random() * 500 + 300);
                }
            } else {
                // ĐÃ SỬA LỖI: Bỏ chữ .style bị thừa gây lỗi ở đây
                successBox.style.display = 'block';
                inputContainer.style.display = 'flex';
                cmdInput.focus();
            }
        }
        setTimeout(printAutoLog, 800);

        // --- HỆ THỐNG XỬ LÝ LỆNH TƯƠNG TÁC (COMMAND LINE) ---
        cmdInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const inputVal = this.value.trim();
                this.value = '';
                if (!inputVal) return;

                const userLine = document.createElement('div');
                userLine.className = 'log-line';
                userLine.innerHTML = `<span style="color:#00ff88">root@override:~#</span> ${inputVal}`;
                terminalBody.appendChild(userLine);

                processCommand(inputVal);
                terminalBody.scrollTop = terminalBody.scrollHeight;
            }
        });

        function createOutputLine(text, isError = false) {
            const line = document.createElement('div');
            line.className = 'log-line';
            if (isError) line.className += ' error-text';
            line.innerHTML = text;
            terminalBody.appendChild(line);
        }

        function processCommand(cmdText) {
